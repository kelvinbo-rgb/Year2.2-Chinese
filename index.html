<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>二年级(下)语文小助手 - 课文领读与拼音笔顺</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=ZCOOL+KuaiLe&display=swap"
        rel="stylesheet">
    <!-- Styles -->
    <link rel="stylesheet" href="style.css?v=20261002_03">
    <!-- Libraries (Offline) -->
    <script src="libs/hanzi-writer.min.js"></script>
    <script src="libs/pinyin-pro.js"></script>
</head>

<body>
    <div id="app">
        <header>
            <div class="header-left">
                <h1>✏️ 二年级(下)语文小助手</h1>
                <span class="sub-badge">课文领读 · 拼音拼读 · 笔顺分解</span>
            </div>
            <nav>
                <button id="nav-learn" class="active">📖 课文与生字</button>
                <button id="nav-custom">✍️ 随练与语音</button>
                <button id="nav-quiz">📝 小测验</button>
            </nav>
        </header>

        <main id="main-content">
            <!-- Dynamic Content rendered by app.js -->
        </main>

        <!-- Upgraded Character & Phonics & Stroke Order Modal (Compact, No Scrollbar) -->
        <div id="char-modal" class="modal hidden">
            <div class="modal-content modal-content-compact">
                <span class="close-btn" id="close-char-modal">&times;</span>
                <div class="modal-compact-layout">
                    <!-- Top Row: Left Tianzige + Right Phonics & Audio -->
                    <div class="modal-top-row">
                        <!-- Left: HanziWriter Tianzige -->
                        <div class="modal-writer-col">
                            <div id="character-display"></div>
                            <div class="writer-controls">
                                <button id="btn-animate" class="action-btn-small" title="播放笔顺动画">▶️ 播放笔顺</button>
                                <button id="btn-quiz" class="action-btn-small" title="在屏幕上描红练写">✏️ 屏幕描红</button>
                            </div>
                        </div>

                        <!-- Right: Phonics & Tone & Audio -->
                        <div class="modal-phonics-col">
                            <div class="pinyin-display-box">
                                <span id="modal-pinyin" class="large-pinyin">chūn</span>
                                <span id="modal-tone-badge" class="tone-badge">第1声 (阴平)</span>
                            </div>
                            <div id="modal-phonics-box" class="phonics-box">
                                <!-- Injected: 声母、韵母、拼读公式 -->
                            </div>
                            <div class="audio-controls">
                                <button id="btn-audio" class="action-btn audio-btn-primary">🔊 听字音 (慢速)</button>
                                <button id="btn-spell" class="action-btn audio-btn-spell">🗣️ 示范拼读</button>
                            </div>
                        </div>
                    </div>

                    <!-- Bottom: Step-by-Step Stroke Decomposition Strip (For copying on paper!) -->
                    <div class="stroke-sequence-section">
                        <div class="section-title-row">
                            <span class="section-title">✍️ 笔顺分解（照着在纸上抄写）：</span>
                            <span id="stroke-count-badge" class="stroke-count-badge">共 0 画</span>
                        </div>
                        <div id="stroke-steps-container" class="stroke-steps-container">
                            <!-- SVGs of step 1, 2, 3... generated dynamically -->
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Edit Lesson Text Modal (For校准2024新版教材) -->
        <div id="edit-text-modal" class="modal hidden">
            <div class="modal-content" style="max-width: 600px; padding: 1.5rem;">
                <span class="close-btn" id="close-edit-modal">&times;</span>
                <h3 style="font-family:'ZCOOL KuaiLe'; color:var(--primary); margin-bottom:0.6rem; font-size:1.4rem;">✏️ 校对/修改本课课文</h3>
                <p style="font-size:0.9rem; color:var(--gray); margin-bottom:0.8rem;">
                    如果您的教材（2024统编新版）字句有差异，可直接在下方修改为书本原文。保存后将自动适配拼音和领读。
                </p>
                <textarea id="edit-text-input" style="width:100%; min-height:220px; padding:0.8rem; border-radius:10px; border:2px solid #CFD8DC; font-size:1.05rem; line-height:1.6; outline:none; font-family:inherit;"></textarea>
                <div style="display:flex; justify-content:space-between; align-items:center; margin-top:1rem; flex-wrap:wrap; gap:0.6rem;">
                    <button id="btn-reset-text" style="background:#ECEFF1; color:#546E7A; border:none; padding:0.5rem 1rem; border-radius:30px; cursor:pointer;">🔄 恢复默认文本</button>
                    <div style="display:flex; gap:0.6rem;">
                        <button id="btn-cancel-edit" style="background:#FFF; border:1px solid #CFD8DC; padding:0.5rem 1.2rem; border-radius:30px; cursor:pointer;">取消</button>
                        <button id="btn-save-text" style="background:var(--secondary); color:#FFF; border:none; padding:0.5rem 1.5rem; border-radius:30px; font-weight:700; cursor:pointer;">💾 保存并应用</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Logic -->
    <script src="data.js?v=20261002_03"></script>
    <script src="app.js?v=20261002_03"></script>
</body>

</html>
